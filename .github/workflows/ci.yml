name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest anthropic
      - run: pip install maturin
      - run: maturin build --release --manifest-path crates/wwnet-py/Cargo.toml --out wheels
      - run: pip install --force-reinstall --no-index --find-links wheels wwnet_native
      - run: python -m compileall -q qgis_plugin/wwnet
      - run: pytest -q qgis_plugin/tests

  arcgis-toolbox:
    # ArcGIS Pro toolbox: tests run against a fake arcpy; CLI-dependent tests need the built binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p wwnet-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest anthropic pyflakes
      - run: pip install maturin
      - run: maturin build --release --manifest-path crates/wwnet-py/Cargo.toml --out wheels
      - run: pip install --force-reinstall --no-index --find-links wheels wwnet_native
      - run: python -m py_compile arcgis_toolbox/WWNet.pyt
      - run: python -m compileall -q arcgis_toolbox/wwnet_arcgis
      - run: python -m pyflakes arcgis_toolbox/WWNet.pyt arcgis_toolbox/wwnet_arcgis
      - run: pytest -q arcgis_toolbox/tests
        env:
          WWNET_EXE: ${{ github.workspace }}/target/debug/wwnet

  wheel:
    # wwnet_native abi3 wheel: loaded by QGIS's / ArcGIS Pro's own Python (no .exe needed)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/wwnet-py
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          # the one required binary: front ends import it, no .exe is needed
          name: wwnet_native-windows-abi3
          path: crates/wwnet-py/dist

  arcgis-bundle:
    # No-install bundle for ArcGIS Pro 3.x (Python 3.11 win_amd64): toolbox + vendor/ (anthropic, pydantic, httpx2,
    # jiter, truststore, typing_extensions, wwnet_native). anyio/sniffio/idna/certifi are left to Pro's own copies.
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install maturin
      - run: maturin build --release --manifest-path crates/wwnet-py/Cargo.toml --out wheels
      - name: Build vendor folder
        run: |
          pip install --target vendor --only-binary=:all: anthropic wheels/wwnet_native-*.whl
          rm -rf vendor/anyio vendor/anyio-* vendor/sniffio vendor/sniffio-* vendor/idna vendor/idna-* \
                 vendor/certifi vendor/certifi-* vendor/bin
          ls vendor
      - run: python arcgis_toolbox/package.py --vendor-dir vendor --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wwnet-arcgis-bundle-win-py311
          path: dist/*.zip
      - name: Smoke test in a Pro-like venv (old anyio / typing_extensions already loaded)
        run: |
          python -m venv pro-like
          pro-like/Scripts/python -m pip install anyio==4.2.0 typing_extensions==4.9.0 sniffio==1.3.0 idna==3.4 certifi==2024.2.2
          python -m zipfile -e dist/wwnet-arcgis-*.zip extracted
          SITE=$(pro-like/Scripts/python -c "import sysconfig; print(sysconfig.get_paths()['purelib'])")
          pro-like/Scripts/python arcgis_toolbox/tests/bundle_smoke.py "$PWD/extracted/WWNet-ArcGIS" "$SITE" native

  arcgis-update:
    # Small, fast artifact for the toolbox's "Update WWNet" tool: only the pure-Python parts (no vendor/, no bin/).
    # No `needs:` on purpose, so it finishes in well under a minute. dist/update is uploaded as a directory, so the
    # downloaded artifact zip contains WWNet-ArcGIS/... directly (one zip layer).
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m py_compile arcgis_toolbox/WWNet.pyt
      - run: python -m compileall -q arcgis_toolbox/wwnet_arcgis
      - run: python arcgis_toolbox/package.py --python-only --unzipped dist/update --out dist
      - uses: actions/upload-artifact@v4
        with:
          name: wwnet-arcgis-update
          path: dist/update
