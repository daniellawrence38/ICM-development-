name: CI
on:
  push:
  pull_request:

jobs:
  rust:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  plugin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest anthropic
      - run: pip install maturin
      - run: maturin build --release --manifest-path crates/wwnet-py/Cargo.toml --out wheels
      - run: pip install --force-reinstall --no-index --find-links wheels wwnet_native
      - run: python -m compileall -q qgis_plugin/wwnet
      - run: pytest -q qgis_plugin/tests

  arcgis-toolbox:
    # ArcGIS Pro toolbox: tests run against a fake arcpy; CLI-dependent tests need the built binary
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p wwnet-cli
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest anthropic pyflakes
      - run: pip install maturin
      - run: maturin build --release --manifest-path crates/wwnet-py/Cargo.toml --out wheels
      - run: pip install --force-reinstall --no-index --find-links wheels wwnet_native
      - run: python -m py_compile arcgis_toolbox/WWNet.pyt
      - run: python -m compileall -q arcgis_toolbox/wwnet_arcgis
      - run: python -m pyflakes arcgis_toolbox/WWNet.pyt arcgis_toolbox/wwnet_arcgis
      - run: pytest -q arcgis_toolbox/tests
        env:
          WWNET_EXE: ${{ github.workspace }}/target/debug/wwnet

  wheel:
    # wwnet_native abi3 wheel: loaded by QGIS's / ArcGIS Pro's own Python (no .exe needed)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: PyO3/maturin-action@v1
        with:
          working-directory: crates/wwnet-py
          command: build
          args: --release --out dist
      - uses: actions/upload-artifact@v4
        with:
          # the one required binary: front ends import it, no .exe is needed
          name: wwnet_native-windows-abi3
          path: crates/wwnet-py/dist
