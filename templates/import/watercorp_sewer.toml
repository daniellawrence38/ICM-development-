# Import template: Water Corporation (WA) gravity-sewer GIS layers -> WWNet model.
# Used by qgis_plugin/wwnet/core/importer.py (QGIS and ArcGIS Pro front ends).
# Every [fields.*] value is a SOURCE FIELD NAME; the front end lets the user override each one.
# An empty string means "not mapped" (the role is skipped / a default is assumed, with a warning).

[options]
snap_tolerance_m = 0.5          # a sewer segment end within this distance of a chamber / connection point / another end is connected
tee_tolerance_m = 0.5           # a lone sewer end this close to another sewer's mid-line is a T-junction: the main is split there
grade_source = "levels"         # "levels" | "field": field = derive a missing invert from FLOW_GRADE and length
grade_tolerance_pct = 10.0      # warn when the grade from levels differs from FLOW_GRADE by more than this
load_connection_points = true   # assign each connection point read to the nearest sewer's upstream node as a load (630 L/d/connection)
cp_load_search_m = 10.0         # max distance (m) from a connection point to its sewer; further ones are reported as unassigned
default_dn = 150                # assumed DN when no (valid) diameter is available

# Standard DN list (mm). Other source diameters map to the nearest, raw value kept as internal diameter.
[standard_dn]
list = [100, 150, 225, 300, 375, 450, 525, 600, 675, 750, 825, 900, 1050, 1200]

[fields.access_chambers]
id = "PACID"
surface_level = "TOPLEV"        # lid level, m AHD (there is no invert field)
chamber_type = "CHAMBER_TY"     # optional: "M- standard manhole" / "J- maintenance shaft" / "I- inspection shaft"

[fields.connection_points]
id = "ID"

[fields.sewers]
id = "ID"
us_node = "US_MANHOLE_ID"
ds_node = "DS_MANHOLE_ID"
us_invert = "UPSTREAM"          # invert levels, m AHD (confirmed)
ds_invert = "DOWNSTREAM"
flow_grade = "FLOW_GRADE"       # "1 in x"; informational: calculated grade from levels takes preference (confirmed)
length = "LENGTH"               # m
shape_length = "Shape_Length"   # optional, diagnostics only (grade ratio line); ignored when the layer has no such field
diameter = "HEIGHT"             # pipe diameter, mm (confirmed by user)
status = "STATUS"
sewer_type = "MAINTYPE"
purpose = "PURPOSE"
material = "MATERIAL"
install_date = "DATEINST"
planset = "PLANSET"

# Coded values: the text before the first "-" is the code ("A- actual" -> "A"). Codes are upper-cased.
[codes.status]
A = "existing"

# Chamber type -> node_type ("ac" access chamber, "ms" maintenance shaft) or "skip" (not imported:
# inspection shafts sit at sewer ends and have no PACID). Unknown codes -> "ac" with a warning.
[codes.chamber_type]
M = "ac"
J = "ms"
I = "skip"

[codes.sewer_type]
R = "reticulation"              # R- retic
B = "reticulation"              # B- branch
M = "main"                      # M- main
E = "is"                        # E- inspection shaft sewer: no upstream access chamber (DS 50 4.2.2)
IO = "io"
IS = "is"

# Codes whose mapping is an assumption: no per-feature warning, one "assumed" line in the summary.
[assumed.sewer_type]

[codes.material]
PVC = "pvc"
UPVC = "pvc"
MPVC = "pvc"
VC = "vc"
AC = "ac_pipe"
DI = "di"
DICL = "di"
CI = "other"
PE = "pe"
HDPE = "pe"
PP = "pe"
GRP = "grp"
RC = "rcpl"
RCP = "rcpl"
RCPL = "rcpl"
CONC = "rcpl"
