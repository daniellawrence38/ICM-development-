# Import template: Water Corporation (WA) gravity-sewer GIS layers -> WWNet model.
# Used by qgis_plugin/wwnet/core/importer.py (QGIS and ArcGIS Pro front ends).
# Every [fields.*] value is a SOURCE FIELD NAME; the front end lets the user override each one.
# An empty string means "not mapped" (the role is skipped / a default is assumed, with a warning).

[options]
snap_tolerance_m = 0.5          # a sewer segment end within this distance of a chamber / connection point / another end is connected
tee_tolerance_m = 0.5           # a lone sewer end this close to another sewer's mid-line is a T-junction: the main is split there
grade_source = "levels"         # "levels" | "field". Missing inverts are ALWAYS estimated (INVERT_ESTIMATED), whichever is chosen:
                                # other end -/+ length / FLOW_GRADE, else from the adjoining sewers' inverts. Real values are never changed.
grade_tolerance_pct = 10.0      # report when the grade from levels differs from FLOW_GRADE by more than this; listed (GRADE_MISMATCH)
                                # only if the fall over the sewer's length differs by > 0.05 m, otherwise counted in one summary line

# LEVEL PLACEHOLDERS: the GIS stores -99.9 (also -9996, -9998 ...) for "unknown". Any value <= -99 in the sewer
# UPSTREAM / DOWNSTREAM inverts and the chamber TOPLEV is treated as MISSING (never a level), as in Import Pressure Data.
# IDS: a chamber PACID, or a sewer US_MANHOLE_ID / DS_MANHOLE_ID, that is blank or all zeros ("0", "0.0", "0000") means "no id".
load_connection_points = true   # assign each connection point read to the nearest sewer's upstream node as a load (630 L/d/connection)
cp_load_search_m = 10.0         # max distance (m) from a connection point to its sewer; further ones are reported as unassigned
import_is_sewers = true         # false: IS stubs (IS sewers, [codes.sewer_type] "is" = MAINTYPE E / IS, with a free end) are left out; IS-coded pipes connected at both ends are kept.
                                # The ArcGIS import tools set it from their "Import IS (inspection shaft) sewers" box (default off).
default_dn = 150                # assumed DN when no (valid) diameter is available

# Standard DN list (mm). Other source diameters map to the nearest, raw value kept as internal diameter.
[standard_dn]
list = [100, 150, 225, 300, 375, 450, 525, 600, 675, 750, 825, 900, 1050, 1200]

[fields.access_chambers]
id = "PACID"
surface_level = "TOPLEV"        # lid level, m AHD (there is no invert field)
chamber_type = "CHAMBER_TY"     # optional: "M- standard manhole" / "J- maintenance shaft" / "I- inspection shaft"

[fields.connection_points]
id = "ID"

[fields.sewers]
id = "ID"
us_node = "US_MANHOLE_ID"
ds_node = "DS_MANHOLE_ID"
us_invert = "UPSTREAM"          # invert levels, m AHD (confirmed)
ds_invert = "DOWNSTREAM"
flow_grade = "FLOW_GRADE"       # "1 in x"; informational: calculated grade from levels takes preference (confirmed)
length = "LENGTH"               # m
shape_length = "Shape_Length"   # optional, diagnostics only (grade ratio line); ignored when the layer has no such field
diameter = "HEIGHT"             # pipe diameter, mm (confirmed by user)
status = "STATUS"
sewer_type = "MAINTYPE"
purpose = "PURPOSE"
material = "MATERIAL"
install_date = "DATEINST"
planset = "PLANSET"

# Coded values: the text before the first "-" is the code ("A- actual" -> "A"). Codes are upper-cased.
# "skip" = the feature is not imported (counted in the summary, no per-feature warning).
# Status: only A (actual) is imported; N (not in use) and D (dead) sewers are skipped. Unknown codes -> "existing" with a warning.
[codes.status]
A = "existing"
N = "skip"
D = "skip"

# Chamber type -> node_type ("ac" access chamber, "ms" maintenance shaft) or "skip" (not imported:
# inspection shafts sit at sewer ends and have no PACID; E deleted manhole and P pit access are not nodes either:
# sewers there connect by geometry). Unknown codes -> "ac" with a warning.
[codes.chamber_type]
M = "ac"
J = "ms"
I = "skip"
E = "skip"                      # E- deleted manhole
P = "skip"                      # P- pit access
F = "ac"                        # F- overflow
OS = "ac"                       # OS- overflow storage
O = "ac"                        # O- oversized
DT = "ac"                       # DT- discharge tower

[codes.sewer_type]
R = "reticulation"              # R- retic
B = "reticulation"              # B- branch
M = "main"                      # M- main
C = "reticulation"              # C- collection
I = "reticulation"              # I- inlet
O = "reticulation"              # O- overflow (overflow pipes stay as sewers)
OS = "reticulation"             # OS- overflow storage
E = "is"                        # E- inspection shaft sewer: no upstream access chamber (DS 50 4.2.2)
IO = "io"
IS = "is"

[overflow]
maintype_codes = ["O", "OS"]    # MAINTYPE codes of emergency overflow pipes (flow only when pumps fail)

# Codes whose mapping is an assumption: no per-feature warning, one "assumed" line in the summary.
[assumed.sewer_type]

[codes.material]
PVC = "pvc"
UPVC = "pvc"
MPVC = "pvc"
VC = "vc"
AC = "ac_pipe"
DI = "di"
DICL = "di"
SU = "other"                    # SU- steel, unlined
CI = "other"
PE = "pe"
HDPE = "pe"
PP = "pe"
GRP = "grp"
RC = "rcpl"
RCP = "rcpl"
RCPL = "rcpl"
CONC = "rcpl"

# ---------------------------------------------------------------------------------------------
# Pressure data (Import Pressure Data tool): Sewer Pump Station points + Sewer Pressure Main polylines.
# Material codes reuse [codes.material] above. UPSTREAM / DOWNSTREAM levels of pressure mains are NOT used (unreliable; profile_json stays NULL).
# Sentinels treated as NULL: diameters / lengths <= 0 or <= -99 (-9996, -9998). Only STATUS "A" (actual) is imported
# ("N- not in use" too when the tool option is ticked); never R (removed) or abandoned codes.
[pressure]
search_distance_m = 30.0        # pump station -> pressure main start (rising main chain search)
snap_tolerance_m = 1.0          # pressure main segment ends within this distance are joined
discharge_distance_m = 1.0      # pressure main far end joins a gravity node only if within this distance (= snap: it actually meets it); else a new
                                # hanging junction node is made at the end (no guessing; connect manually). Raise it to allow looser joins.

wet_well_distance_m = 1.0        # the gravity sewer end AT the pump station point is its wet well; further = no wet well guessed
                                # (a new node WW_<ps_id> is made at the station point, left unconnected; connect the inlet sewer manually)

[pressure.fields.pump_stations]
id = "SAP_ID"                   # ps_id; when empty the ID field below is used (integer text)
alt_id = "ID"
name = "SAP_NAME"
name2 = "PSNAME"
status = "STATUS"

[pressure.fields.mains]
id = "ID"
status = "STATUS"
diameter = "DIAMETER"           # nominal, mm
internal_diameter = "INDIAM1"   # mm
material = "MATERIAL"
length = "LENGTH"               # m
main_name = "MAINNAME"          # e.g. "SPS NO2"
