[package]
name = "wwnet-py"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PyO3 bindings exposing wwnet hydraulics and DS50 rules to Python (module `wwnet_native`)"

[lib]
name = "wwnet_native"
crate-type = ["cdylib"]

[features]
# Enabled by maturin (see pyproject.toml). Left off for plain `cargo build/test`
# so the cdylib links against libpython.
extension-module = ["pyo3/extension-module"]

[dependencies]
pyo3 = { version = "0.23", features = ["abi3-py39"] }
wwnet-hydraulics = { path = "../wwnet-hydraulics" }
wwnet-rules = { path = "../wwnet-rules" }
wwnet-design = { path = "../wwnet-design" }
wwnet-core = { path = "../wwnet-core" }
wwnet-sim = { path = "../wwnet-sim" }
serde_json.workspace = true

[build-dependencies]
# Windows version information on wwnet_native.pyd (no-op on other targets)
winresource = { version = "0.1", default-features = false }
